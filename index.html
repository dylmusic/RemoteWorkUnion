<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Work Union</title>
  <meta name="description" content="Remote jobs, resume tips & hiring insights. Free, weekly." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@RemoteWorkUnion" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #003BB5 0%, #1A84FF 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      padding: 60px 24px;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      width: 100%;
      max-width: 480px;
    }

    .logo {
      height: 100px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.25));
    }

    .brand-name {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.7);
    }

    .divider {
      height: 56px;
    }

    .headline {
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .sub {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.68);
      line-height: 1.6;
    }

    .form-wrap {
      margin-top: 36px;
      width: 100%;
    }

    .email-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 100px;
      padding: 6px 6px 6px 22px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .email-row:focus-within {
      border-color: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
    }

    .email-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      min-width: 0;
    }
    .email-input::placeholder { color: rgba(255, 255, 255, 0.45); }

    .join-btn {
      flex-shrink: 0;
      padding: 12px 22px;
      border-radius: 100px;
      border: none;
      background: #fff;
      color: #003BB5;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.15s;
    }
    .join-btn:hover { opacity: 0.88; transform: scale(1.02); }
    .join-btn:active { transform: scale(1); }

    .success-msg {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.9);
      padding: 14px 0;
    }
    .success-msg.show { display: flex; }

    .checklist {
      margin-top: 36px;
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .checklist li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
    }

    .check-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check-icon svg {
      width: 10px;
      height: 10px;
      stroke: #fff;
    }

    footer {
      margin-top: 56px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
    }
    footer a {
      color: rgba(255, 255, 255, 0.55);
      text-decoration: none;
      transition: color 0.2s;
    }
    footer a:hover { color: #fff; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .email-row {
        flex-direction: column;
        border-radius: 16px;
        padding: 10px;
        gap: 8px;
      }
      .email-input { padding: 6px 8px; width: 100%; text-align: center; }
      .join-btn { width: 100%; border-radius: 10px; padding: 14px; }
    }
  </style>
</head>
<body>

  <div class="page">

    <img src="RemoteWorkUnion.PNG" alt="Remote Work Union" class="logo" />
    <p class="brand-name">Remote Work Union</p>

    <div class="divider"></div>

    <p class="headline">Join the newsletter.</p>
    <p class="sub">Remote jobs, resume tips &amp; hiring insights. Free, weekly.</p>

    <div class="form-wrap">
      <form class="email-row" id="form" novalidate>
        <input
          type="email"
          class="email-input"
          id="email"
          placeholder="Your email address"
          autocomplete="email"
          required
          aria-label="Email address"
        />
        <button type="submit" class="join-btn">Join Free</button>
      </form>
      <div class="success-msg" id="success" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        You're in — check your inbox!
      </div>
    </div>

    <ul class="checklist" aria-label="What you get">
      <li>
        <span class="check-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
        Free Resume Guide
      </li>
      <li>
        <span class="check-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
        Remote Job Listings
      </li>
      <li>
        <span class="check-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
        Hiring Tips &amp; Tricks
      </li>
      <li>
        <span class="check-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></span>
        Weekly Remote Work Updates
      </li>
    </ul>

    <footer>
      <a href="https://x.com/RemoteWorkUnion" target="_blank" rel="noopener noreferrer">@RemoteWorkUnion on X</a>
    </footer>

  </div>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('email');
    const success = document.getElementById('success');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val || !val.includes('@')) return;
      console.log('Subscriber:', val);
      form.style.display = 'none';
      success.classList.add('show');
    });
  </script>

</body>
</html>
